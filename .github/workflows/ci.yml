name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java-lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and package the Lambda
        run: mvn -B -f lambda-validator/pom.xml package

  python-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker-image:
    runs-on: ubuntu-latest
    needs: python-service
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image
        run: docker build -t invoice-intake-agent python-service
